<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <rect width="600" height="600" fill="#0C1017"/>
  <defs>
    <linearGradient id="copperGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0944F"/>
      <stop offset="100%" stop-color="#C27835"/>
    </linearGradient>
    <linearGradient id="greenGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E57A"/>
      <stop offset="100%" stop-color="#008746"/>
    </linearGradient>
  </defs>
  <g transform="translate(300, 220)">
    <!-- Strata 1: Origin (Copper Lower Blade) -->
    <polygon points="-120,60 -60,-20 -20,-20 -80,60" fill="url(#copperGrad4)"/>
    <!-- Strata 2: Nature (Emerald Mid Blade) -->
    <polygon points="-70,60 10,-50 50,-50 -30,60" fill="url(#greenGrad4)"/>
    <!-- Strata 3: Evolution (Titanium Forward Chevron) -->
    <path d="M-20,60 L80,-70 L120,-70 L40,60 Z" fill="#F8FAFC"/>
    <polygon points="80,-70 120,-70 70,-10 50,-10" fill="#CBD5E1"/>
  </g>
  <text x="300" y="460" fill="#F8FAFC" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="52" font-weight="800" text-anchor="middle" letter-spacing="6">ON<tspan fill="#00A859" font-style="italic">&amp;</tspan>E</text>
  <text x="300" y="505" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="6">ORIGIN • NATURE • EVOLUTION</text>
</svg>